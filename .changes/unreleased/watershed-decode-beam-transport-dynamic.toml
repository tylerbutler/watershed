package = "watershed"
kind = "Breaking"
body = "Decode the BEAM transport `Dynamic` at the foreign boundary: `runtime_beam` transport and presence payloads are now `Json` instead of `Dynamic`. The `on_event` callback is `fn(String, Json) -> Nil`, `Msg.Inbound` carries `payload: Json`, and `PresenceState`, `PresenceDiff`, and `PresenceError` each carry `payload: Json`. Migration: consumers decode a payload with `json.parse(json.to_string(payload), your_decoder())` instead of running a `Dynamic` decoder. Trade-off: inbound frames now normalize `Dynamic` to `Json` once at the boundary and consumers decode from `Json`, which adds a serialization step on the inbound path over decoding `Dynamic` directly; the wire format and observable behavior are unchanged. This is a non-blocking performance cost and does not redesign the aquamarine transport or the runtime."
