<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>watershed · collaborative pixel canvas</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .app { width: min(96vw, 36rem); padding: 2rem; }

      /* Two sizes only, as in the drum machine: a 1.5rem heading against
         0.8rem supporting text. */
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
      .status, .hint, .error { font-size: 0.8rem; }
      .status, .hint { opacity: 0.7; }
      .error { color: crimson; }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin: 1rem 0;
      }
      button {
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }
      button:hover, button:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      button[aria-pressed="true"] { background: currentColor; }
      button[aria-pressed="true"] > span { filter: invert(1); }

      .palette { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 1rem 0; }
      .swatch {
        width: 1.75rem;
        height: 1.75rem;
        padding: 0;
        border-radius: 0.35rem;
        border: 1px solid rgb(128 128 128 / 0.5);
        cursor: pointer;
      }
      .swatch[aria-pressed="true"] {
        outline: 3px solid currentColor;
        outline-offset: 2px;
      }
      /* Index 0 is "erase". It paints the same colour as the empty canvas, so
         the swatch needs a mark of its own to be findable. */
      .swatch.erase { position: relative; }
      .swatch.erase::after {
        content: "";
        position: absolute;
        inset: 20%;
        border-top: 1px solid rgb(128 128 128 / 0.9);
        transform: rotate(45deg);
        transform-origin: center;
      }

      /* The bitmap is 64x64 — one canvas pixel per cell — and is scaled up by
         CSS. `pixelated` keeps the cells crisp, and doing it this way means a
         paint is `fillRect(x, y, 1, 1)` with no device-pixel-ratio arithmetic
         anywhere. */
      #canvas {
        width: 100%;
        max-width: 32rem;
        aspect-ratio: 1;
        image-rendering: pixelated;
        border: 1px solid rgb(128 128 128 / 0.5);
        border-radius: 0.25rem;
        touch-action: none;
        cursor: crosshair;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { main } from "./dist/pixel_canvas_lustre.mjs";
      main();
    </script>
  </body>
</html>
