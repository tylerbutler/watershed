<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>watershed · retro tutorial</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: color-mix(in srgb, canvas 92%, black 8%);
      }
      .shell {
        max-width: 76rem;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      .masthead {
        display: flex;
        gap: 1rem;
        justify-content: space-between;
        align-items: start;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .masthead-actions {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .status,
      .hint,
      .peer-copy,
      .empty,
      .focus-copy,
      .column-copy {
        color: color-mix(in srgb, currentColor 65%, transparent);
      }
      .board {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
      }
      @media (max-width: 52rem) {
        .board {
          grid-template-columns: 1fr;
        }
      }
      .column,
      .presence,
      .focus-panel,
      .unfiled {
        border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        border-radius: 1rem;
        background: color-mix(in srgb, canvas 94%, currentColor 6%);
      }
      .column,
      .presence,
      .focus-panel,
      .unfiled {
        padding: 1rem;
      }
      .column h2,
      .presence h2,
      .focus-panel h2,
      .unfiled h2 {
        margin: 0 0 0.35rem;
        font-size: 1rem;
      }
      .compose {
        display: flex;
        gap: 0.5rem;
        margin: 0.9rem 0 1rem;
      }
      input,
      button {
        font: inherit;
      }
      input {
        flex: 1 1 auto;
        min-width: 0;
        border-radius: 0.75rem;
        border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        padding: 0.65rem 0.8rem;
        background: transparent;
        color: inherit;
      }
      button {
        border-radius: 999px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        padding: 0.55rem 0.9rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .cards {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }
      .card {
        border-radius: 0.9rem;
        border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        background: color-mix(in srgb, currentColor 5%, canvas 95%);
        padding: 0.8rem;
      }
      .card.focused {
        border-color: color-mix(in srgb, #4f46e5 55%, currentColor 20%);
        box-shadow: 0 0 0 2px color-mix(in srgb, #4f46e5 20%, transparent);
      }
      .card-text {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .card-meta,
      .card-actions {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 0.75rem;
      }
      .card-meta {
        font-size: 0.85rem;
      }
      .author {
        margin-right: auto;
      }
      .tally {
        font-variant-numeric: tabular-nums;
        font-weight: 650;
      }
      .focus-line {
        margin: 0.6rem 0 0;
        font-size: 0.85rem;
      }
      .roster {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 0.75rem;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.22rem 0.65rem;
        border-radius: 999px;
        border: 1px solid currentColor;
        font-size: 0.85rem;
      }
      .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: currentColor;
      }
      .error {
        color: #c0392b;
        min-height: 1.2rem;
        margin: 0.5rem 0 0;
      }
      .stack {
        display: grid;
        gap: 1rem;
      }
      .top-row {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(18rem, 1fr);
        gap: 1rem;
      }
      @media (max-width: 52rem) {
        .top-row {
          grid-template-columns: 1fr;
        }
      }
      .hint {
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { main } from "./dist/retro_tutorial_lustre.mjs";
      main();
    </script>
  </body>
</html>
