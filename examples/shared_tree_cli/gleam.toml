name = "shared_tree_cli"
version = "1.0.0"
description = "Create and edit SharedTree containers without an SDK seed"
licences = ["MIT"]
gleam = ">= 1.7.0"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 0.62.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
argv = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
watershed = { path = "../.." }

[dev-dependencies]
startest = ">= 0.8.0 and < 1.0.0"
