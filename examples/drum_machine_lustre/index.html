<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>watershed · collaborative drum machine</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .machine { width: min(96vw, 46rem); padding: 2rem; }
      /* Two sizes only: 1.5rem heading against 0.85rem supporting text. The
         earlier draft also had a 0.8rem step for track names, which sat too
         close to 0.85 to read as a distinct level. */
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
      .status, .hint, .track-name, .error { font-size: 0.8rem; }
      .status, .hint { opacity: 0.7; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin: 1rem 0; }
      button {
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }
      button:hover, button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

      /* The grid is a single tab stop; the arrow keys move within it, so the
         focus ring belongs on the cursor cell rather than on each button. */
      .grid {
        display: grid;
        gap: 0.35rem;
        margin: 1rem 0;
      }
      .grid:focus-visible { outline: 2px solid Highlight; outline-offset: 4px; }
      .row {
        display: grid;
        grid-template-columns: 4.5rem repeat(16, 1fr);
        gap: 0.25rem;
        align-items: center;
      }
      .track-name { text-align: right; padding-right: 0.5rem; opacity: 0.8; }
      .step {
        aspect-ratio: 1;
        min-width: 0;
        padding: 0;
        border-radius: 0.25rem;
        border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        background: transparent;
      }
      /* Every fourth step starts a beat — without this grouping a 16-step row
         is unreadable. A faint fill marks the beat; `.on` below overrides it,
         so an enabled downbeat still reads as enabled. */
      .step.downbeat { background: color-mix(in srgb, currentColor 12%, transparent); }
      .step.on { background: currentColor; }
      .step.on.triggered {
        box-shadow: 0 0 0 0.2rem color-mix(in srgb, currentColor 35%, transparent);
        transform: scale(0.82);
      }
      .step.focused { outline: 2px solid Highlight; outline-offset: 1px; }

      /* The playhead is a sibling row above the grid, sharing the row's exact
         column template so its cells sit over the step columns. Its children
         are built and animated by `audio_ffi.mjs`, never by Lustre. */
      .playhead {
        display: grid;
        grid-template-columns: 4.5rem repeat(16, 1fr);
        gap: 0.25rem;
        margin-top: 1rem;
      }
      .playhead .beat {
        height: 0.25rem;
        border-radius: 0.125rem;
        background: transparent;
      }
      .playhead .beat.lit { background: currentColor; }

      .gate {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin: 1rem 0;
      }
      .transport, .mixer {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin: 0.75rem 0;
      }
      .tempo, .volume { display: flex; gap: 0.5rem; align-items: center; }
      .tempo span, .volume span, .caveat, .gate .hint { font-size: 0.8rem; }
      .tempo span, .volume span { opacity: 0.7; }
      /* The one number worth reading at a glance, and it must not reflow as it
         changes — a proportional font makes the slider look jittery. */
      .bpm { font-variant-numeric: tabular-nums; opacity: 1 !important; }
      .tempo-block { display: flex; flex-direction: column; gap: 0.25rem; }
      input[type="range"]:disabled { opacity: 0.5; cursor: not-allowed; }
      /* While the room is signing off, the number on the slider is a proposal
         rather than the tempo the sequencer is running at — so it reads as a
         ghost, and the pending line below says what it is waiting for. */
      .bpm.ghost { opacity: 0.55 !important; font-style: italic; }
      .proposal {
        font-size: 0.8rem;
        margin: 0;
        max-width: 42rem;
        border-left: 2px solid currentColor;
        padding-left: 0.6rem;
      }
      .proposal .signoffs { font-variant-numeric: tabular-nums; opacity: 0.75; }
      .proposal .hint { display: block; opacity: 0.6; }
      .mute { padding: 0.35rem 0.6rem; font-size: 0.8rem; }
      .mute.muted { opacity: 0.4; text-decoration: line-through; }
      .caveat { opacity: 0.7; max-width: 42rem; }
      .error { color: crimson; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { main } from "./dist/drum_machine_lustre.mjs";
      main();
    </script>
  </body>
</html>
