<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>watershed · project room</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      button, input, textarea {
        border: 1px solid color-mix(in srgb, currentColor 28%, transparent);
        border-radius: 0.5rem;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button { padding: 0.45rem 0.7rem; cursor: pointer; }
      input { min-width: 0; padding: 0.45rem 0.6rem; }
      button:hover:not(:disabled) {
        background: color-mix(in srgb, currentColor 8%, transparent);
      }
      button:disabled { cursor: default; opacity: 0.45; }
      .room {
        width: min(78rem, 100%);
        margin: 0 auto;
        padding: 2rem;
      }
      .room-header {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: start;
        margin-bottom: 1rem;
      }
      h1 { margin: 0 0 0.25rem; font-size: 1.7rem; }
      h2 { margin: 0 0 1rem; font-size: 1.05rem; }
      p { margin: 0; }
      .status { opacity: 0.65; }
      .runtime-error {
        border: 1px solid #c0392b;
        border-radius: 0.5rem;
        padding: 0.75rem;
        margin-bottom: 1rem;
      }
      .demo-guide {
        border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1rem;
        background: color-mix(in srgb, CanvasText 3%, Canvas);
      }
      .demo-guide h2 { margin-bottom: 0.35rem; }
      .demo-guide ol {
        margin: 0.85rem 0 0;
        padding-left: 1.4rem;
        display: grid;
        gap: 0.45rem;
      }
      .routes {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.65rem;
        margin-top: 1rem;
      }
      .route {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 0.6rem;
        align-items: center;
        border: 1px solid color-mix(in srgb, currentColor 16%, transparent);
        border-radius: 0.5rem;
        padding: 0.7rem;
      }
      .route-kind {
        grid-row: 1 / span 2;
        border-radius: 999px;
        padding: 0.2rem 0.45rem;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .route-local .route-kind {
        background: color-mix(in srgb, #5577cc 24%, transparent);
      }
      .route-shared .route-kind {
        background: color-mix(in srgb, #3a9b65 24%, transparent);
      }
      .route-presence .route-kind {
        background: color-mix(in srgb, #a45cc7 24%, transparent);
      }
      .route-detail { opacity: 0.65; font-size: 0.86rem; }
      .component-palette {
        display: grid;
        grid-template-columns: minmax(12rem, 1fr) auto;
        gap: 0.75rem 1rem;
        align-items: end;
        border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .component-palette h2 {
        grid-column: 1 / -1;
        margin-bottom: 0;
      }
      .component-palette .component-actions { margin-top: 0; }
      .workspace {
        display: grid;
        grid-template-columns: repeat(3, minmax(16rem, 1fr));
        gap: 1rem;
        align-items: start;
      }
      .workspace-instance {
        display: grid;
        gap: 0.5rem;
      }
      .instance-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: end;
        gap: 0.4rem;
      }
      .component {
        border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        border-radius: 0.75rem;
        padding: 1rem;
        min-height: 20rem;
      }
      .component h2 { margin-bottom: 0.35rem; }
      .component-description {
        min-height: 3.4rem;
        margin-bottom: 1rem;
        opacity: 0.65;
        font-size: 0.9rem;
        line-height: 1.4;
      }
      .task-list, .activity-list, .poll-choices, .ownership-slots {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.55rem;
      }
      .poll h3 { margin: 0 0 0.35rem; font-size: 0.95rem; }
      .poll-state { margin-bottom: 0.75rem; font-weight: 700; }
      .poll-choices li, .ownership-slots li {
        display: grid;
        gap: 0.45rem;
        padding: 0.65rem;
        border: 1px solid color-mix(in srgb, currentColor 16%, transparent);
        border-radius: 0.5rem;
      }
      .component-actions, .ownership-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.75rem;
      }
      .ownership-actions { margin-top: 0; }
      .task {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 0.5rem;
        align-items: center;
        padding: 0.65rem;
        border: 1px solid color-mix(in srgb, currentColor 16%, transparent);
        border-radius: 0.5rem;
      }
      .task-selected {
        outline: 2px solid Highlight;
        outline-offset: 1px;
      }
      .task-title { text-align: left; border: 0; padding: 0; }
      .task-complete .task-title { text-decoration: line-through; opacity: 0.65; }
      .task-presence {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      .task-peer {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        border: 1px solid;
        border-radius: 999px;
        padding: 0.12rem 0.4rem;
        font-size: 0.72rem;
        white-space: nowrap;
      }
      .inspector-card {
        border-left: 3px solid Highlight;
        padding: 0.8rem 1rem;
        background: color-mix(in srgb, Highlight 7%, transparent);
      }
      .inspector-card h3 { margin: 0.35rem 0 0.75rem; }
      .inspector-card p + p { margin-top: 0.35rem; }
      .inspector-local {
        color: Highlight;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .presence-roster {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-bottom: 0.75rem;
      }
      .presence-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border: 1px solid;
        border-radius: 999px;
        padding: 0.15rem 0.45rem;
        font-size: 0.78rem;
      }
      .presence-dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
      }
      .notes-editor {
        width: 100%;
        min-height: 18rem;
        padding: 0.75rem;
        resize: vertical;
      }
      .activity-list li {
        border-bottom: 1px solid color-mix(in srgb, currentColor 16%, transparent);
        padding: 0.55rem 0;
      }
      .checklist-items {
        list-style: none;
        padding: 0;
        margin: 0.75rem 0 0;
        display: grid;
        gap: 0.55rem;
      }
      .checklist-items li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 0.45rem;
      }
      .tally-value {
        margin: 1rem 0;
        font-size: 2rem;
      }
      .empty, .placeholder { opacity: 0.6; }
      @media (max-width: 72rem) {
        .workspace { grid-template-columns: repeat(2, minmax(16rem, 1fr)); }
      }
      @media (max-width: 48rem) {
        .routes { grid-template-columns: 1fr; }
        .workspace { grid-template-columns: 1fr; }
        .component-palette { grid-template-columns: 1fr; }
        .component { min-height: auto; }
        .component-description { min-height: auto; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { main } from "./dist/project_room_lustre.mjs";
      main();
    </script>
  </body>
</html>
