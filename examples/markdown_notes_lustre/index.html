<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9ebee" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <title>watershed · markdown notes</title>
    <style>
      /* Saira Variable, latin subset, weight 100-900 and width 50-125% in one
         file. Installed as @fontsource-variable/saira and copied into fonts/
         by the build (scripts/copy-fonts.mjs), so the package owns the version
         and there are no committed bytes to drift from it. The file is in the
         service worker's SHELL: this app's offline story is the thing under
         test, and a label face that only arrives online would undercut it.
         OFL-1.1 — licence copied to fonts/LICENSE-saira.txt alongside it. */
      @font-face {
        font-family: "Saira Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        font-stretch: 50% 125%;
        src: url("./fonts/saira-latin-wdth-normal.woff2")
          format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* ── Console panel ──────────────────────────────────────────────────
         Light-only, deliberately. The use scene is a developer at a daylit
         desk with two tabs open; a console is a light object; and the
         product's anti-references rule out both a dark terminal costume and
         cream neutrals. Painting the ground explicitly also retires the two
         AA contrast failures the old untested dark path carried. */
      :root {
        color-scheme: light;

        --panel: oklch(93% 0.004 250);
        --panel-deep: oklch(88.5% 0.005 250);
        --panel-lip: oklch(97% 0.003 250);
        --surface: oklch(98.8% 0.002 250);
        --ink: oklch(24% 0.012 250);
        --muted: oklch(45% 0.011 250);
        --rule: oklch(24% 0.012 250 / 0.16);
        --rule-faint: oklch(24% 0.012 250 / 0.08);

        /* Signal lamps. Strict semantics, and never the only channel: every
           lamp is read out in words beside it. */
        --lamp-off: oklch(24% 0.012 250 / 0.22);
        --lamp-live: oklch(66% 0.15 68); /* local, in flight, not yet on disk */
        --lamp-safe: oklch(52% 0.13 155); /* on disk / converged */
        --lamp-armed: oklch(52% 0.2 27); /* at risk / destructive */
        /* The lamp red passes on a light fill but only reaches 4.33:1 as small
           text on the rack; this is its text-safe twin. */
        --armed-ink: oklch(43% 0.18 27);
        /* The focus ring is the thing a keyboard user follows, so it is drawn
           in ink: the lamp amber measured 2.27:1 on the rack and failed
           non-text contrast on every control in it. */
        --focus: var(--ink);

        /* Semi-condensed is the panel width: labels have to hold a narrow
           strip, and Saira's flat-cut terminals are the instrument character
           the world asked for. */
        --label: "Saira Variable", system-ui, sans-serif;
        --label-width: 87.5%;

        --strip: 0.1875rem;
        --ease-settle: cubic-bezier(0.16, 1, 0.3, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* The UA's 1em paragraph margin was defeating `.status-stack`'s 0.15rem
         gap, so the tightest intended group rendered as the loosest. */
      body,
      h1,
      h2,
      p,
      pre,
      ul {
        margin: 0;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--panel);
        color: var(--ink);
        margin: 0;
        min-height: 100vh;
        font-size: 1rem;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      .app {
        display: grid;
        grid-template-columns: 19.5rem minmax(0, 1fr);
        min-height: 100vh;
      }

      /* ── The rack ─────────────────────────────────────────────────────── */

      .sidebar {
        background: var(--panel-deep);
        border-right: 1px solid var(--rule);
        box-shadow: inset -1px 0 0 var(--panel-lip);
        padding: 1.25rem 1rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        min-width: 0;
      }

      .sidebar h1 {
        font-family: var(--label);
        font-stretch: var(--label-width);
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* ── Engraved strip labels ────────────────────────────────────────── */

      .room {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
      }

      .room-id {
        flex: 1;
        min-width: 0;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
        font-size: 0.8125rem;
        font-variant-numeric: tabular-nums;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 2px;
        padding: 0.3rem 0.5rem;
        box-shadow: inset 0 1px 2px oklch(24% 0.012 250 / 0.1);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .room-copy {
        flex-shrink: 0;
        font-size: 0.75rem;
        padding: 0.35rem 0.55rem;
      }

      /* ── Master meter ─────────────────────────────────────────────────── */

      .status-stack {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        padding: 0.75rem;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 3px;
        box-shadow:
          inset 0 1px 0 var(--panel-lip),
          0 1px 2px oklch(24% 0.012 250 / 0.06);
      }

      .status {
        font-size: 0.8125rem;
        color: var(--muted);
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
      }

      /* The one line that answers "is my work safe?" — the console's master
         meter, and the largest thing in the rack. */
      .status.headline {
        font-size: 0.9375rem;
        font-weight: 650;
        color: var(--ink);
        letter-spacing: -0.005em;
        margin-bottom: 0.15rem;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid var(--rule-faint);
      }

      .status::before {
        content: "";
        flex-shrink: 0;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--lamp-off);
        box-shadow: inset 0 0 0 1px oklch(24% 0.012 250 / 0.15);
        transform: translateY(-0.05rem);
        transition: background 240ms var(--ease-settle);
      }

      /* Differentiated by form, not only size: the master is a meter segment
         so it never reads as one more dot in a column of dots. */
      .status.headline::before {
        width: 0.25rem;
        height: 0.9rem;
        border-radius: 1px;
        background: var(--lamp-live);
        align-self: center;
        transform: none;
      }

      /* Each line drives its own lamp: a lamp that is always dark is
         decoration, and this world only earns its lamps by meaning them. */
      .status.lamp-safe::before {
        background: var(--lamp-safe);
      }

      .status.lamp-live::before {
        background: var(--lamp-live);
      }

      .status.lamp-armed::before {
        background: var(--lamp-armed);
      }

      .app[data-safety="safe"] .status.headline::before {
        background: var(--lamp-safe);
      }

      .app[data-safety="at-risk"] .status.headline::before {
        background: var(--lamp-armed);
      }

      .status-failed {
        color: var(--armed-ink);
        font-weight: 550;
      }

      .status-failed::before {
        background: var(--lamp-armed);
      }

      .hint {
        font-size: 0.8125rem;
        color: var(--muted);
      }

      .error {
        font-size: 0.8125rem;
        color: var(--armed-ink);
        font-weight: 550;
      }

      /* ── System error rack ────────────────────────────────────────────── */

      .errors {
        border: 1px solid var(--lamp-armed);
        border-radius: 3px;
        background: oklch(52% 0.2 27 / 0.06);
        padding: 0.6rem 0.75rem;
      }

      .errors h2 {
        font-family: var(--label);
        font-stretch: var(--label-width);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--armed-ink);
        margin-bottom: 0.4rem;
      }

      .errors ul {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .errors li {
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
        font-size: 0.75rem;
        line-height: 1.45;
        color: var(--ink);
        overflow-wrap: anywhere;
      }

      /* ── Channel strips ───────────────────────────────────────────────── */

      .note-list {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-width: 0;
      }

      .note-item {
        display: flex;
        align-items: stretch;
        gap: 0.25rem;
        min-width: 0;
      }

      /* Every strip is an engraved card, and every strip carries its own lamp:
         the whole document shares one snapshot, so a note is exactly as saved
         as every other note, and the lamp says so on each track rather than
         only once at the top. Selection is fill and weight — never a lamp
         colour, which has to keep meaning what it means. */
      .note-open {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-align: left;
        font: inherit;
        font-size: 0.9375rem;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 2px;
        padding: 0.5rem 0.6rem;
        cursor: pointer;
        box-shadow: inset 0 1px 2px oklch(24% 0.012 250 / 0.09);
        overflow: hidden;
        transition: background 180ms var(--ease-settle);
      }

      .note-open::before {
        content: "";
        flex-shrink: 0;
        opacity: 0.75;
        width: 0.3125rem;
        height: 0.3125rem;
        border-radius: 50%;
        background: var(--lamp-off);
        box-shadow: inset 0 0 0 1px oklch(24% 0.012 250 / 0.15);
        transition: background 240ms var(--ease-settle);
      }

      .note-open.lamp-safe::before {
        background: var(--lamp-safe);
      }

      .note-open.lamp-live::before {
        background: var(--lamp-live);
      }

      .note-open.lamp-armed::before {
        background: var(--lamp-armed);
      }

      .note-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .note-open:hover {
        background: var(--panel-lip);
      }

      .note-open.open {
        background: var(--panel-lip);
        font-weight: 620;
        border-color: var(--muted);
      }

      .note-item.dragging {
        opacity: 0.45;
      }

      .note-item.drop-target,
      .drop-end.drop-target {
        outline: 2px dashed var(--muted);
        outline-offset: 2px;
      }

      .note-delete {
        flex-shrink: 0;
        width: 2rem;
        border: 1px solid var(--rule);
        border-radius: 2px;
        background: var(--panel);
        /* 3.95:1 at opacity .5 was below AA on an enabled control. */
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1;
        cursor: pointer;
      }

      .note-delete:hover {
        background: var(--lamp-armed);
        border-color: var(--lamp-armed);
        color: var(--surface);
      }

      .note-confirm,
      .note-cancel {
        flex-shrink: 0;
        font-size: 0.75rem;
        padding: 0.35rem 0.5rem;
      }

      .note-confirm {
        background: var(--lamp-armed);
        border-color: var(--lamp-armed);
        color: var(--surface);
        font-weight: 600;
      }

      .drop-end {
        min-height: 0.75rem;
      }

      /* A rack is bounded: the strips end at a foot rather than dissolving
         into forty percent of undifferentiated panel. */
      .note-list::after {
        content: "";
        display: block;
        margin-top: 0.5rem;
        border-top: 1px solid var(--rule-faint);
      }

      /* ── Panel controls ───────────────────────────────────────────────── */

      input,
      button {
        font: inherit;
        border-radius: 2px;
      }

      input {
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--rule);
        background: var(--surface);
        color: var(--ink);
        box-shadow: inset 0 1px 2px oklch(24% 0.012 250 / 0.09);
        min-width: 0;
      }

      input::placeholder {
        color: var(--muted);
      }

      input:focus-visible,
      button:focus-visible,
      .editor:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
        /* The world's amber survives as the inner line, where it never has to
           carry the contrast on its own. */
        box-shadow: 0 0 0 1px var(--lamp-live);
      }

      button {
        padding: 0.45rem 0.7rem;
        font-size: 0.875rem;
        font-weight: 550;
        color: var(--ink);
        background: var(--panel-lip);
        border: 1px solid var(--rule);
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--panel-lip);
      }

      button:active:not(:disabled) {
        box-shadow: inset 0 1px 3px oklch(24% 0.012 250 / 0.18);
        transform: translateY(0.5px);
      }

      button:disabled {
        color: var(--muted);
        background: var(--panel-deep);
        box-shadow: none;
        cursor: not-allowed;
      }

      button.destructive {
        background: var(--lamp-armed);
        border-color: var(--lamp-armed);
        color: var(--surface);
      }

      button.destructive:hover:not(:disabled) {
        background: oklch(45% 0.2 27);
      }

      .compose {
        display: flex;
        gap: 0.4rem;
      }

      .compose input {
        flex: 1;
        min-width: 0;
      }

      /* ── Writing surface ──────────────────────────────────────────────── */

      .main {
        background: var(--panel);
        padding: 1.5rem 1.75rem 1.75rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-width: 0;
      }

      /* The note title is the one place the face runs at reading size, so it
         opens back out toward normal width and drops the tracking. */
      .main h2 {
        font-family: var(--label);
        font-stretch: 100%;
        font-size: 1.625rem;
        font-weight: 620;
        letter-spacing: -0.015em;
        line-height: 1.15;
      }

      /* Grid, not flex: the editor sits inside a library-owned wrapper with an
         inline `display: block`, so `flex: 1` on the textarea never applied and
         left 350px of dead panel below it. A grid row stretches that wrapper
         whatever its own display is. */
      /* The writing column is capped at a readable measure and the transport
         row and tag rail are capped with it, so the three read as one column
         rather than a narrow editor under a full-width rule. */
      .editor-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-height: 0;
        min-width: 0;
        max-width: 82ch;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 1.15rem 1.25rem 1.25rem;
        box-shadow: inset 0 1px 0 var(--panel-lip);
      }

      /* The textarea's wrapper is library-owned and carries an inline
         `display: block`, so it can never itself become a flex container — but
         `flex` on it is not inline, so it can still be the row that grows.
         The textarea then fills it with a plain `height: 100%`. */
      .editor-wrap > div:not([class]) {
        flex: 1 1 auto;
        min-height: 12rem;
      }

      .editor:focus-visible {
        outline-offset: -2px;
        box-shadow: none;
      }

      .editor {
        width: 100%;
        height: 100%;
        min-height: 12rem;
        padding: 0.9rem 1rem;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
        font-size: 0.9375rem;
        line-height: 1.7;
        color: var(--ink);
        background: transparent;
        border: none;
        border-top: 1px solid var(--rule-faint);
        border-radius: 0;
        padding-left: 0;
        padding-right: 0;
        resize: none;
      }

      .editor[readonly] {
        background: var(--panel);
        color: var(--muted);
      }

      /* ── Transport row ────────────────────────────────────────────────── */

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        align-items: center;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--rule-faint);
        flex-shrink: 0;
      }

      .toolbar button {
        font-family: var(--label);
        font-stretch: var(--label-width);
        font-size: 0.8125rem;
        font-weight: 620;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.4rem 0.6rem;
        min-height: 2rem;
      }

      /* ── Tags ─────────────────────────────────────────────────────────── */

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
        padding-top: 0.75rem;
        border-top: 1px solid var(--rule-faint);
      }

      .tags input {
        flex: 1 1 8rem;
        /* `.compose input` had this and `.tags input` did not, which is what
           pushed the page 167px past the viewport at 390px. */
        min-width: 0;
        max-width: 14rem;
        font-size: 0.8125rem;
        padding: 0.35rem 0.5rem;
      }

      .tag-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .tag-chip {
        display: inline-flex;
        gap: 0.3rem;
        align-items: center;
        padding: 0.2rem 0.5rem;
        border: 1px solid var(--rule);
        border-radius: 2px;
        background: var(--panel);
        font-size: 0.75rem;
      }

      .tag-chip button {
        border: none;
        background: none;
        box-shadow: none;
        padding: 0 0.1rem;
        font-size: 0.8125rem;
        line-height: 1;
        color: var(--muted);
      }

      .tag-chip button:hover:not(:disabled) {
        color: var(--lamp-armed);
        background: none;
      }

      .tag-filter {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }

      .tag-filter button {
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        box-shadow: none;
      }

      .tag-filter button.active {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--surface);
      }

      /* ── Banners ──────────────────────────────────────────────────────── */

      .banner {
        padding: 0.85rem 1rem;
        border: 1px solid var(--rule);
        border-radius: 3px;
        background: var(--panel);
        font-size: 0.9375rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 62ch;
      }

      .banner-command {
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
        font-size: 0.8125rem;
        background: var(--ink);
        color: var(--panel-lip);
        padding: 0.5rem 0.7rem;
        border-radius: 2px;
        overflow-x: auto;
      }

      /* The record-enabled state: the one place the panel goes red. */
      .recovery {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        padding: 1rem 1.1rem;
        border: 1px solid var(--lamp-armed);
        border-top: var(--strip) solid var(--lamp-armed);
        border-radius: 3px;
        background: oklch(52% 0.2 27 / 0.05);
        max-width: 66ch;
      }

      .recovery h2 {
        font-family: var(--label);
        font-stretch: 100%;
        font-size: 1.125rem;
        font-weight: 620;
        letter-spacing: -0.01em;
        color: var(--armed-ink);
      }

      .recovery p {
        font-size: 0.9375rem;
      }

      .recovery-safe {
        font-weight: 600;
      }

      .recovery-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.25rem;
      }

      .app.recovery-required .editor[readonly] {
        border-color: oklch(52% 0.2 27 / 0.35);
      }

      /* ── One authored moment ──────────────────────────────────────────── */

      /* A console's saving lamp pulses; everything else settles. This is the
         only animation on the page. */
      @keyframes lamp-pulse {
        50% {
          opacity: 0.35;
        }
      }

      .app[data-safety="saving"] .status.headline::before {
        animation: lamp-pulse 1.1s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before {
          animation: none !important;
          transition: none !important;
        }
      }

      /* ── Narrow ───────────────────────────────────────────────────────── */

      @media (max-width: 52rem) {
        .app {
          grid-template-columns: minmax(0, 1fr);
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--rule);
          box-shadow: none;
          padding: 1rem;
          gap: 1rem;
        }

        .main {
          padding: 1.25rem 1rem 1.5rem;
        }

        .tags input {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
    THESIS: A note is a track on a console, and every track shows whether it is
    local, saved, or converged. Refuses the two-pane notes app whose only state
    signal is a gray "Saved".
    OWN-WORLD: Pale zinc panel, engraved inset strip cards, hairline panel
    scoring, and discrete indicator lamps in amber (local), green (on disk),
    red (at risk). Panel labels are uppercase, tracked and weighted in a
    workhorse UI face — the register Operate asks for, and deliberately not a
    self-hosted display face: this example's offline story is the thing under
    test, so it ships no binary asset the service worker would have to
    precache. Light-only; flat, never metal.
    STORY: The visitor sees where their work actually is, edits without
    wondering, and believes the durability claims because the panel never lies.
    FIRST VIEWPORT: A rack of note strips left, master meter at its top; a
    full-height writing surface right with the transport row above it.
    FORM: Console channel strip; candidate 6 of the grounded list; seed 5263ef4a.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, and DESIGN.md
    -->
    <div id="app"></div>
    <script>
      window.addEventListener("error", (event) => {
        window.__watershedLoadError = String(event.message || event.error);
      });
    </script>
    <script type="module">
      import { main } from "./dist/markdown_notes_lustre.mjs";
      main();
      window.__watershedMarkdownNotesLoaded = () => true;
      // App-shell offline layer: cache-first for the built bundle, nothing
      // else intercepted. sw.js is stamped from the bundle hash at build.
      if ("serviceWorker" in navigator) {
