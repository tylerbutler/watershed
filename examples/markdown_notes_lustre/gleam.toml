name = "markdown_notes_lustre"
version = "1.0.0"
description = "Peer-to-peer markdown notes (Lustre SPA) with a register-mode OR-map root and disk-first persistence"
licences = ["MIT"]
gleam = ">= 1.7.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.62.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.0.0 and < 6.0.0"
watershed = { path = "../.." }
watershed_lustre = { path = "../../watershed_lustre" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 3.0.0"
