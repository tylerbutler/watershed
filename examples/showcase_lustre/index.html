<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>watershed · showcase</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: start center;
        min-height: 100vh;
        margin: 0;
      }
      .shell { width: 100%; max-width: 52rem; padding: 2rem; }
      /* The shell adds a heading level the single-app examples do not have:
         document title above panel title. A 1.5 ratio keeps the two apart. */
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
      h2 { font-size: 1rem; margin: 0 0 0.25rem; }
      .status { opacity: 0.7; margin-top: 0; }
      input, textarea {
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button {
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }
      button:hover:not(:disabled) { opacity: 0.8; }
      button:disabled { opacity: 0.3; cursor: default; }

      /* ── Shell chrome ─────────────────────────────────────────────────── */
      .switcher {
        display: flex;
        gap: 0.5rem;
        margin: 1.25rem 0 1rem;
        flex-wrap: wrap;
      }
      .tab { border-color: color-mix(in srgb, currentColor 35%, transparent); }
      .tab-selected {
        border-color: currentColor;
        background: color-mix(in srgb, currentColor 10%, transparent);
        font-weight: 600;
      }
      .roster {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
        margin: 0.5rem 0;
        min-height: 1.6rem;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.15rem 0.5rem;
        border: 1.5px solid currentColor;
        border-radius: 999px;
        font-size: 0.8rem;
      }
      .chip .dot {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        display: inline-block;
      }
      .chip-where { opacity: 0.7; }
      .panel {
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        border-radius: 0.75rem;
        padding: 1.25rem;
        min-height: 18rem;
      }
      .placeholder { opacity: 0.75; }
      .placeholder-state { font-size: 0.8rem; opacity: 0.7; }
      .compose { display: flex; gap: 0.5rem; margin: 0.75rem 0; flex-wrap: wrap; }
      .compose input { flex: 1 1 auto; min-width: 0; }
      .empty { opacity: 0.5; }

      /* ── Text panel ───────────────────────────────────────────────────── */
      .editor {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 0.5rem;
        padding: 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1.5;
        resize: vertical;
      }
      .anchor {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      }
      .anchor p { font-size: 0.8rem; opacity: 0.7; }
      .anchor-detail {
        font-variant-numeric: tabular-nums;
        opacity: 0.9 !important;
      }

      /* ── Playlist panel ───────────────────────────────────────────────── */
      .tracks { list-style: none; padding: 0; margin: 0; }
      .track {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem;
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        border-radius: 0.5rem;
        margin-bottom: 0.4rem;
      }
      .ordinal {
        font-variant-numeric: tabular-nums;
        opacity: 0.5;
        min-width: 1.75rem;
      }
      .track-body { flex: 1 1 auto; min-width: 0; }
      .track-title { font-weight: 600; }
      .track-artist { font-size: 0.8rem; opacity: 0.65; }
      .track-controls { display: flex; gap: 0.25rem; flex: 0 0 auto; }
      .track-controls button { padding: 0.35rem 0.5rem; }

      /* ── Sudoku panel ─────────────────────────────────────────────────── */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        justify-content: center;
        margin: 0 0 1rem;
      }
      .mistakes { font-variant-numeric: tabular-nums; }
      .grid {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        width: min(92vw, 32rem);
        aspect-ratio: 1;
        margin: 1rem auto;
        border: 3px solid currentColor;
      }
      .cell {
        position: relative;
        border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        border-radius: 0;
        padding: 0;
        display: grid;
        place-items: center;
        min-width: 0;
        background: transparent;
      }
      .cell:nth-child(3n) { border-right-width: 3px; }
      .cell:nth-child(9n) { border-right-width: 0; }
      .cell:nth-child(n+19):nth-child(-n+27),
      .cell:nth-child(n+46):nth-child(-n+54) { border-bottom-width: 3px; }
      .cell.given {
        font-weight: 700;
        background: color-mix(in srgb, currentColor 10%, transparent);
      }
      .cell.selected { outline: 3px solid Highlight; outline-offset: -3px; }
      .cell .cursor {
        position: absolute;
        top: 0; left: 0;
        transform: translateY(-100%);
        font-size: 0.55rem;
        line-height: 1;
        padding: 1px 3px;
        border-radius: 3px 3px 3px 0;
        color: #fff;
        white-space: nowrap;
        pointer-events: none;
        z-index: 1;
      }
      .digit { font-size: clamp(1.25rem, 5vw, 2rem); line-height: 1; }
      .notes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.05rem;
        width: 80%;
        height: 80%;
        font-size: clamp(0.45rem, 2vw, 0.8rem);
        opacity: 0.75;
      }
      .note { min-width: 0; }
      .error {
        color: #c0392b;
        font-size: 0.8rem;
        min-height: 1.2rem;
        margin: 0.25rem 0;
      }
      .hint { font-size: 0.8rem; opacity: 0.6; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { main } from "./dist/showcase_lustre.mjs";
      main();
    </script>
  </body>
</html>
