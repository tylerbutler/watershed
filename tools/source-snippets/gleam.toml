name = "source_snippets"
version = "0.1.0"
description = "Internal Gleam source-snippet marker extractor"
licences = ["MIT"]
gleam = ">= 1.7.0"
# JavaScript is the default target: the tool is a short-lived file-in,
# file-out CLI, and Node is the runtime a documentation build already has.
# A BEAM project can still run it with `--target erlang`.
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.62.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
filepath = ">= 1.1.2 and < 2.0.0"
argv = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
