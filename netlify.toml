# Netlify configuration for the generated Lustre site.

[build]
  base = "."
  command = "./website_lustre/scripts/netlify-build.sh"
  publish = "website_lustre/dist"

[build.environment]
  NODE_VERSION = "24"
  OTP_VERSION = "28.5"
  GLEAM_VERSION = "1.18.1"
  REBAR3_VERSION = "3.27.0"
  PNPM_VERSION = "11.13.1"
