# Netlify configuration for the watershed landing site.
# The site lives in website/; its build compiles the Gleam kernel to
# JavaScript first (see website/scripts/netlify-build.sh).
#
# No build plugins. The prebuild's source-snippet generator needs escript and
# erlc; Netlify's Ubuntu build image installs esl-erlang, which supplies both.
# netlify-build.sh checks for them and fails fast if that ever stops holding.

[build]
  base = "website"
  command = "./scripts/netlify-build.sh"
  # Relative to base, so this publishes website/dist.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  GLEAM_VERSION = "1.16.0"
