# Local-checkout override: build floodgate from a clone on disk instead of
# fetching `main` from GitHub. Use it to run the integration suite against
# uncommitted server changes. Layer it on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --wait --build
#
# Or via the justfile: `just integration-up-local`.
#
# The context is the standalone floodgate repo root. Adjust the path if your
# clone lives elsewhere.
services:
  floodgate:
    image: floodgate:local
    build:
      context: ../floodgate
      dockerfile: Dockerfile
