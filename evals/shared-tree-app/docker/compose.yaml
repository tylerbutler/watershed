services:
  floodgate:
    image: floodgate:shared-tree-eval-21faeaa48671
    profiles: [watershed]
    build:
      context: https://github.com/tylerbutler/floodgate.git#21faeaa4867127cdf437d21c9b5cafc8f027d42d
      dockerfile: Dockerfile
      target: local
    ports:
      - "127.0.0.1:0:3000"
    environment:
      FLOODGATE_TENANT_ID: dev-tenant
      FLOODGATE_JWT_SECRET: levee-dev-secret-change-in-production
      FLOODGATE_BIND: 0.0.0.0
      FLOODGATE_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      FLOODGATE_STORAGE_BACKEND: memory
      FLOODGATE_ALLOWED_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 2s
      timeout: 3s
      start_period: 15s
      retries: 30
