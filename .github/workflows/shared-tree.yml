name: SharedTree

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: SharedTree native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          version: "11.13.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/shared-tree-oracle/package-lock.json
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix tools/shared-tree-oracle ci
      - run: npm --prefix tools/shared-tree-oracle test
      - run: just shared-tree-test
