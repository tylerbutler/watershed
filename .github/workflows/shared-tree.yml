name: SharedTree

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: SharedTree native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install_args: erlang gleam
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          version: "11.13.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/shared-tree-oracle/package-lock.json
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix tools/shared-tree-oracle ci
      - run: npm --prefix tools/shared-tree-oracle test
      - run: just shared-tree-test

  interoperability:
    name: SharedTree interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install_args: erlang gleam
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          version: "11.13.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/shared-tree-oracle/package-lock.json
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix tools/shared-tree-oracle ci
      - run: npm --prefix tools/shared-tree-oracle run source:prepare
      - run: npm --prefix tools/shared-tree-oracle run source:verify
      - name: Three-client M1 and M2 acceptance
        run: just shared-tree-interop
      - name: Native-container creation acceptance
        run: just shared-tree-create-interop
      - name: Preserve interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-tree-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            tools/shared-tree-oracle/.output/interop/
            tools/shared-tree-oracle/.output/creation/
