name: Website browser integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gleam-lang/setup-gleam@v1
        with:
          gleam-version: "1.18.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.13.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: pnpm test:integration:browser:required
        working-directory: website
        env:
          WATERSHED_CHROME: ${{ steps.chrome.outputs.chrome-path }}
