name = "watershed"
version = "0.1.0"
description = "Gleam DDS client toolkit for levee — SharedMap kernel, runtime actor, and wire codecs"
licences = ["MIT"]
repository = { type = "github", user = "tylerbutler", repo = "watershed" }
gleam = ">= 1.7.0"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 0.62.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_crypto = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_fetch = ">= 1.4.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
lattice_core = ">= 1.0.0 and < 2.0.0"
lattice_counters = ">= 1.1.0 and < 2.0.0"
lattice_maps = ">= 1.1.0 and < 2.0.0"
lattice_registers = ">= 1.1.0 and < 2.0.0"
lattice_sets = ">= 1.1.0 and < 2.0.0"
lattice_sequence = ">= 1.0.0 and < 2.0.0"
lattice_text_core = ">= 1.0.0 and < 2.0.0"
lattice_text = ">= 1.0.0 and < 2.0.0"
# Pinned to commits, not `main`. A branch ref is not a pin: every package that
# resolves fresh (each example carries its own manifest) picked up whatever
# `main` was that day, which is how the examples drifted onto incompatible
# revisions of these three and stopped building. `aquamarine` in particular
# cannot move past this commit while `startest` is a dev-dependency — newer
# aquamarine pulls `collie >= 3.0`, which needs `gleam_stdlib >= 1.0`, and
# `startest` -> `bigben` caps stdlib below 1.0. Bump these deliberately.
signet = { git = "https://github.com/tylerbutler/signet", ref = "51843ffe6f38a57c295e1a139fd926dc947eca6d" }
spillway = { git = "https://github.com/tylerbutler/spillway", ref = "25f515cf67027e4b2db2344c3abb2141056e45fc" }
aquamarine = { git = "https://github.com/tylerbutler/aquamarine", ref = "45451e8a5b8846258dd4a5e72094078423b82017" }

[dev-dependencies]
startest = ">= 0.8.0 and < 1.0.0"
qcheck = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.5.0 and < 3.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
exception = ">= 2.1.0 and < 3.0.0"

# Trellis (https://trellis.tylerbutler.com) supplies the workspace layer Gleam
# lacks: task fan-out across the packages here, plus changelog fragments,
# version bumps, and tagging. Members are auto-discovered from git — every
# directory with a `gleam.toml` — so there is no `members` list to keep in sync.
[tools.trellis]
[tools.trellis.exclude]
# The examples are demos, not products. They stay in the dependency graph and in
# every `trellis run` task, but get no changelog, no version bump, and no tag:
# `@release` maps them to the `workspace` lifecycle.
"@release" = ["examples/*"]

# `gleam test` is an error, not a no-op, in a package with no `test/` directory,
# so the suite-less packages are named out of the fan-out. Delete an entry here
# the day that package grows a suite — `trellis doctor` fails on a glob that
# matches no member, so a stale name here cannot go unnoticed.
test = [
    "examples/flowboard_lustre",
    "examples/clap_counter_lustre",
    "examples/dice_cli",
    "examples/dice_lustre",
    "examples/playlist_lustre",
    "examples/scoreboard_cli",
    "examples/text_lustre",
]

# Two target families live here, and only `watershed` belongs to both: it and
# the CLI examples run on the BEAM, while `watershed_lustre` and the browser
# examples compile to JavaScript. A package built for the wrong target is a hard
# error (missing externals one way, `lustre` the other), so each family gets its
# own task and its own exclusions rather than one `build` that cannot express it.
build-erlang = ["watershed_lustre", "examples/*_lustre"]
build-javascript = ["examples/dice_cli", "examples/scoreboard_cli"]

[tools.trellis.tasks.build-erlang]
command = "gleam build --target erlang"

[tools.trellis.tasks.build-javascript]
command = "gleam build --target javascript"

# `watershed` and `watershed_lustre` are consumed by git ref, not from the
# registry, so they get changelogs, versions, and tags but are never pushed to
# Hex. Raise a package to `hex` here when that changes.
[tools.trellis.publish.lifecycle]
default = "git_only"
